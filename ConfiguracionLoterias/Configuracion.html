<!doctype html>
<html>
  <head>
    <title>Configuración de Loterías</title>

    <link rel="stylesheet" href="css/estilos.css" />
    <script src="js/script.js"></script>
  </head>

  <body>
    <h1>Configuración de Loterías</h1>

    <h2>Loterías registradas</h2>

    <ul id="listaLoterias">
      <li>LEIDSA</li>

      <li>LOTEKA</li>
    </ul>

    <h2>Registrar Lotería</h2>

    <p>Nombre de la lotería:</p>

    <input type="text" id="nombreLoteria" />

    <br /><br />

    <button onclick="agregarLoteria()">Guardar</button>

    <h2>Configurar Sorteo</h2>

    <p>Nombre del sorteo:</p>

    <input type="text" id="nombreSorteo" />

    <p>Hora del sorteo:</p>
    <input type="time" id="horaSorteo" />

    <p>Dias:</p>
    <input type="checkbox" id="lunes" /> Lunes
    <input type="checkbox" id="martes" /> Martes
    <input type="checkbox" id="miercoles" /> Miércoles
    <input type="checkbox" id="jueves" /> Jueves
    <input type="checkbox" id="viernes" /> Viernes
    <input type="checkbox" id="sabado" /> Sábado
    <input type="checkbox" id="domingo" /> Domingo
     <br /><br />

    <button onclick="agregarSorteo()">Guardar Sorteo</button>

    <h2>Sorteos configurados</h2>
    <ul id="listaSorteos"></ul>
  </body>
</html>
