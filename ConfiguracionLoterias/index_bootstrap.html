<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Configuración de Loterías</title>
    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://bootstrapcdn.com" />
    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css" />
    <!-- JavaScript propio -->
    <script src="js/script.js"></script>
    <style>
        /* Ajustes finos de elegancia corporativa */
        .navbar-brand {
            letter-spacing: 0.5px;
        }
        .card {
            border: 1px solid rgba(0,0,0,.08);
            border-radius: 6px;
        }
        .card-header {
            border-bottom: 1px solid rgba(0,0,0,.08);
            padding: 1rem 1.25rem;
        }
        .form-control, .custom-select {
            border-color: #ced4da;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .form-control:focus, .custom-select:focus {
            border-color: #4a5568;
            box-shadow: 0 0 0 0.2rem rgba(74, 85, 104, 0.15);
        }
        .btn-dark {
            background-color: #2d3748;
            border-color: #2d3748;
        }
        .btn-dark:hover {
            background-color: #1a202c;
            border-color: #1a202c;
        }
        .text-muted-custom {
            color: #718096;
        }
        .bg-card-days {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .form-check-label {
            font-size: 0.95rem;
            color: #4a5568;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light text-dark" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <!-- Encabezado Corporativo -->
    <nav class="navbar navbar-dark bg-dark shadow-sm py-3">
        <div class="container">
            <span class="navbar-brand mb-0 h1 font-weight-bold text-uppercase" style="font-size: 1.15rem;">
                Panel de Control de Loterías
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            
            <!-- SECCIÓN IZQUIERDA: GESTIÓN DE LOTERÍAS -->
            <div class="col-lg-5 mb-4">
                <!-- Registrar lotería -->
                <div class="card shadow-sm mb-4 bg-white">
                    <div class="card-header bg-white">
                        <h2 class="h6 mb-0 font-weight-bold text-dark text-uppercase" style="letter-spacing: 0.5px;">
                            Registrar Nueva Lotería
                        </h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group mb-4">
                            <label Bars for="nombreLoteria" class="small font-weight-bold text-muted-custom text-uppercase">
                                Nombre de la Entidad
                            </label>
                            <input type="text" id="nombreLoteria" class="form-control form-control-lg" placeholder="Ej. LEIDSA" />
                        </div>
                        <button type="button" class="btn btn-dark btn-block font-weight-bold py-2 text-white" onclick="agregarLoteria()">
                            Confirmar Registro
                        </button>
                    </div>
                </div>

                <!-- Loterías registradas -->
                <div class="card shadow-sm bg-white">
                    <div class="card-header bg-white">
                        <h2 class="h6 mb-0 font-weight-bold text-dark text-uppercase" style="letter-spacing: 0.5px;">
                            Loterías del Sistema
                        </h2>
                    </div>
                    <div class="card-body p-0">
                        <ul id="listaLoterias" class="list-group list-group-flush">
                            <li class="list-group-item text-secondary py-3">LEIDSA</li>
                            <li class="list-group-item text-secondary py-3">LOTEKA</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DERECHA: CONFIGURACIÓN DE SORTEOS -->
            <div class="col-lg-7 mb-4">
                <!-- Configurar sorteo -->
                <div class="card shadow-sm mb-4 bg-white">
                    <div class="card-header bg-white">
                        <h2 class="h6 mb-0 font-weight-bold text-dark text-uppercase" style="letter-spacing: 0.5px;">
                            Configuración de Sorteos
                        </h2>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="nombreSorteo" class="small font-weight-bold text-muted-custom text-uppercase">
                                    Nombre del Sorteo
                                </label>
                                <input type="text" id="nombreSorteo" class="form-control" placeholder="Ej. Sorteo de la Mañana" />
                            </div>
                            
                            <div class="col-md-6 form-group mb-3">
                                <label for="horaSorteo" class="small font-weight-bold text-muted-custom text-uppercase">
                                    Horario Establecido
                                </label>
                                <input type="time" id="horaSorteo" class="form-control" />
                            </div>
                        </div>

                        <!-- Selector de Lotería Asociada -->
                        <div class="form-group mb-4">
                            <label for="selectLoteria" class="small font-weight-bold text-muted-custom text-uppercase">
                                Asignar a Lotería
                            </label>
                            <select id="selectLoteria" class="custom-select">
                                <option value="LEIDSA">LEIDSA</option>
                                <option value="LOTEKA">LOTEKA</option>
                            </select>
                        </div>

                        <!-- Panel de Selección de Días -->
                        <div class="form-group mb-4">
                            <label class="small font-weight-bold text-muted-custom text-uppercase mb-2 d-block">
                                Días Operativos
                            </label>
                            <div class="card bg-card-days p-3">
                                <div class="row">
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="lunes" class="form-check-input" />
                                            <label class="form-check-label" for="lunes">Lunes</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="martes" class="form-check-input" />
                                            <label class="form-check-label" for="martes">Martes</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="miercoles" class="form-check-input" />
                                            <label class="form-check-label" for="miercoles">Miércoles</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="jueves" class="form-check-input" />
                                            <label class="form-check-label" for="jueves">Jueves</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="viernes" class="form-check-input" />
                                            <label class="form-check-label" for="viernes">Viernes</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-2">
                                            <input type="checkbox" id="sabado" class="form-check-input" />
                                            <label class="form-check-label" for="sabado">Sábado</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check mb-0">
                                            <input type="checkbox" id="domingo" class="form-check-input" />
                                            <label class="form-check-label" for="domingo">Domingo</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
